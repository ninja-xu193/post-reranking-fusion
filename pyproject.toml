[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "post-reranking-fusion"
version = "0.1.0"
description = "Reference methods for score fusion and tie-aware reranking evaluation"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = ["numpy>=1.24,<3", "scipy>=1.10,<2", "scikit-learn>=1.3,<2"]

[project.scripts]
postfusion = "postfusion.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
